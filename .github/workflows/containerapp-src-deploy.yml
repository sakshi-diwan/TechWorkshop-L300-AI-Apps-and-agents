name: Build and Deploy src to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/containerapp-src-deploy.yml'

permissions:
  contents: read

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  IMAGE_NAME: chat-app

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Azure Container Apps extension is available
        run: az extension add --name containerapp --upgrade --yes

      - name: Log in to Azure Container Registry
        shell: bash
        run: |
          REGISTRY_NAME="${AZURE_CONTAINER_REGISTRY%%.azurecr.io}"
          az acr login --name "$REGISTRY_NAME"

      - name: Build and push image from src folder
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_REF="${AZURE_CONTAINER_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker build -f src/Dockerfile -t "$IMAGE_REF" src
          docker push "$IMAGE_REF"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

      - name: Update Azure Container App image and env vars
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_REF" \
            --set-env-vars \
              FOUNDRY_ENDPOINT="${{ secrets.FOUNDRY_ENDPOINT }}" \
              gpt_endpoint="${{ secrets.GPT_ENDPOINT }}" \
              embedding_endpoint="${{ secrets.EMBEDDING_ENDPOINT }}" \
              phi_4_endpoint="${{ secrets.PHI_4_ENDPOINT }}"
