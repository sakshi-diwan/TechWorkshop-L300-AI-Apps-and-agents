name: Deploy Handoff Service Agent

on:
  push:
    paths:
      - 'src/prompts/HandoffAgentPrompt.txt'
      - 'src/infra/agents/handoff-service.json'
      - '.github/workflows/handoff_service_agent_update.yml'
  workflow_dispatch:

jobs:
  deploy-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login via Azure CLI
        uses: azure/login@v2.1.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install azure-ai-projects azure-identity python-dotenv openai

      - name: Validate handoff evaluation dataset
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
        run: python src/utils/validate_handoff_evaluation.py --dataset src/data/handoff_service_evaluation_grounded.jsonl --min-accuracy 0.65

      - name: Deploy handoff-service agent to Foundry
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          GPT_DEPLOYMENT: ${{ secrets.GPT_DEPLOYMENT }}
        run: |
          INSTRUCTIONS=$(python3 -c "
          import json
          with open('src/prompts/HandoffAgentPrompt.txt', 'r') as f:
              print(json.dumps(f.read()))
          ")

          jq --arg model "$GPT_DEPLOYMENT" \
             --argjson instructions "$INSTRUCTIONS" \
             '.definition.model = $model | .definition.instructions = $instructions' \
             src/infra/agents/handoff-service.json > /tmp/agent-payload.json

          az rest --method POST \
            --url "${FOUNDRY_ENDPOINT}/agents/handoff-service/versions?api-version=2025-11-15-preview" \
            --headers "Content-Type=application/json" \
            --resource "https://ai.azure.com" \
            --body @/tmp/agent-payload.json

          echo "handoff-service agent deployed successfully."
